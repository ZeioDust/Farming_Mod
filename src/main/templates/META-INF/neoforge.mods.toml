description='''
Real plant breeding. Every seed carries a genome: cross plants, read their genes in a lab, and breed lines that crop better, shrug off blight and grow anywhere.
Manage soil chemistry and greenhouses, grade your harvests from C to Prime, sell them at the Produce Exchange, fill contracts, process crops into goods, and master gene editing and show judging.
'''

